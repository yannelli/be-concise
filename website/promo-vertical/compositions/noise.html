  <script>
    (function () {
      const B = 0.5; // one beat at 120 BPM
      const tl = gsap.timeline({ paused: true });
      const tunnel = [...document.querySelectorAll("#nz-tunnel .nz-p")].map((el) => ({
        el,
        x: +el.dataset.x,
        y: +el.dataset.y,
        z: +el.dataset.z,
      }));
      const cam = { z: 0, dim: 1 };

      // Depth: haze and focus are a function of each phrase's distance from the lens.
      function render() {
        for (const p of tunnel) {
          const ez = p.z + cam.z;
          let opacity, blur;
          if (ez > 1250) {
            opacity = 0;
            blur = 0;
          } else if (ez >= 0) {
            const k = Math.min(1, Math.max(0, (ez - 650) / 600));
            opacity = 1 - k;
            blur = Math.min(24, Math.max(0, ((ez - 200) / 1000) * 24));
          } else {
            opacity = Math.max(0.18, 1 - (-ez / 7000) * 0.82);
            blur = Math.min(14, Math.max(0, ((-ez - 400) / 5600) * 14));
          }
          p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, ${ez}px) translate(-50%, -50%)`;
          p.el.style.opacity = (opacity * cam.dim).toFixed(3);
          p.el.style.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : "none";
        }
      }

      // 1. Flight: fastest at frame 0, settling as the wall begins.
      tl.fromTo(cam, { z: 0 }, { z: 4200, duration: 3, ease: "power1.out" }, 0);

      // 2. Wall: phrases slam in on beats, then the barrage accelerates from
      // seven frames apart to one, so the last 1.5 s is too much to take in.
      // Depth is computed per frame (renderWall) so overlapping slams never fight.
      const wall = [...document.querySelectorAll("#nz-wall .nz-w")];
      const slamFrames = [90, 105, 120, 135, 142, 148, 153, 157, 160, 163, 165, 167, 169, 170, 171, 172, 173, 174, 175, 176, 177, 178];
      const slams = slamFrames.map((frame, i) => {
        const gap = i > 0 ? (frame - slamFrames[i - 1]) / 30 : B;
        return { t: frame / 30, slam: Math.min(0.35, Math.max(0.16, gap * 2)), push: Math.min(0.25, Math.max(0.1, gap * 2)) };
      });
      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const expoOut = (v) => (v >= 1 ? 1 : 1 - Math.pow(2, -10 * v));
      const cubicOut = (v) => 1 - Math.pow(1 - v, 3);
      const splitAt = (i) => 6.1 + (i % 3) * 0.02;
      // One per-frame pass: tunnel depth, then the wall barrage.
      function renderWall() {
        render();
        const t = tl.time();
        wall.forEach((el, i) => {
          const arrive = expoOut(clamp01((t - slams[i].t) / slams[i].slam));
          let depth = 0;
          for (let j = i + 1; j < wall.length; j++) depth += cubicOut(clamp01((t - slams[j].t) / slams[j].push));
          const opacity = arrive * Math.max(0.16, 1 - 0.1 * depth);
          // Before its split the phrase is ours; from splitAt the split tween owns its transform.
          if (t < splitAt(i)) el.style.transform = `translate3d(0px, 0px, ${(-2600 * (1 - arrive) - 70 * depth).toFixed(2)}px)`;
          el.style.opacity = opacity.toFixed(3);
        });
      }
      tl.to(cam, { dim: 0.45, duration: 2.5, ease: "none" }, 3);

      // The rush: the tunnel surges again and the wall pushes at the lens.
      tl.to(cam, { z: 7600, duration: 1.5, ease: "power3.in" }, 4.5);
      tl.fromTo("#nz-wall", { scale: 1 }, { scale: 1.22, duration: 1.5, ease: "power3.in" }, 4.5);
      // Deterministic shake, rising over the last 30 frames and settled for the stroke.
      for (let f = 150; f < 180; f++) {
        const amp = ((f - 150) / 29) * 14;
        tl.set("#nz-wall", { x: Math.sin(f * 2.3) * amp, y: Math.cos(f * 3.7) * amp }, f / 30);
      }
      tl.set("#nz-wall", { x: 0, y: 0 }, 6);

      // 3. The stroke splits the wall; the slit floods to the clean world.
      tl.fromTo("#nz-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "expo.out" }, 6);
      wall.forEach((el, i) => {
        const up = parseFloat(el.style.top) + parseFloat(el.style.fontSize) / 2 < 960; // line-height 1
        tl.fromTo(
          el,
          { y: 0, z: -70 * (wall.length - 1 - i), rotationX: 0, filter: "blur(0px)" },
          { y: up ? -1200 : 1200, z: -1400, rotationX: up ? 28 : -28, filter: "blur(16px)", duration: 0.55, ease: "power3.in", immediateRender: false },
          splitAt(i),
        );
      });
      tl.to(cam, { dim: 0, duration: 0.3, ease: "power2.in" }, 6.1);
      tl.fromTo("#nz-light", { clipPath: "inset(50% 0% 50% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power2.inOut" }, 6.12);

      // The bar becomes the full stop after "first" (square measured from rendered pixels).
      const SQ_X = 356;
      const SQ_Y = 1166;
      tl.to("#nz-bar", { x: SQ_X, y: SQ_Y - 949, scaleX: 41 / 1080, scaleY: 31 / 22, duration: 0.4, ease: "power3.inOut" }, 6.45);
      tl.set("#nz-bar", { opacity: 0 }, 6.85);
      tl.set("#nz-sq", { opacity: 1 }, 6.85);
      document.querySelectorAll(".nz-tw").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, y: 70, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 6.55 + i * 0.06);
      });

      // Fly through the title into the proof world.
      tl.fromTo("#nz-title-wrap", { scale: 1, filter: "blur(0px)", opacity: 1 }, { scale: 6, filter: "blur(14px)", opacity: 0, duration: 10 / 30, ease: "power3.in" }, 7.7);

      tl.eventCallback("onUpdate", renderWall);
      renderWall();
      window.__timelines["noise"] = tl;
    })();
  </script>
