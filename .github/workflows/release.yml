name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: node scripts/check.mjs
      - run: node --test test/*.test.mjs
      - run: node plugins/concise/test/run-tests.mjs
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish semantic release
        run: node scripts/release.mjs --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish npm package
        run: |
          version="$(jq -r .version package.json)"
          if [ "$(npm view "$(jq -r .name package.json)@$version" version 2>/dev/null)" = "$version" ]; then
            echo "npm already has version $version"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish Claude directory branch
        run: |
          version="$(jq -r .version plugins/concise/.claude-plugin/plugin.json)"
          tree="$RUNNER_TEMP/claude-directory"
          if git rev-parse --verify --quiet origin/claude-directory >/dev/null; then
            git worktree add -B claude-directory "$tree" origin/claude-directory
          else
            git worktree add --orphan -b claude-directory "$tree"
          fi
          if [ "$(jq -r .version "$tree/.claude-plugin/plugin.json" 2>/dev/null)" = "$version" ]; then
            echo "claude-directory already has version $version"
            exit 0
          fi
          node scripts/directory-tree.mjs "$tree"
          git -C "$tree" add -A
          git -C "$tree" commit -m "chore(release): claude-directory $version" \
            -m "Built from $(git rev-parse HEAD) by scripts/directory-tree.mjs. Do not edit this branch."
          git -C "$tree" push origin HEAD:refs/heads/claude-directory
