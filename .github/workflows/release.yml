name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check.mjs
      - run: node --test test/*.test.mjs
      - run: node plugins/concise/test/run-tests.mjs
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish semantic release
        run: node scripts/release.mjs --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge released versions into dev
        run: |
          git fetch origin main dev
          git checkout -B dev origin/dev
          git merge --no-ff origin/main -m 'chore(release): sync main into dev'
          git push origin HEAD:refs/heads/dev
